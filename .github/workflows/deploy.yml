name: Deploy Application

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      ######################################################
      # Checkout Repository
      ######################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################
      # Read Project Configuration
      ######################################################

      - name: Read deployment.json
        run: |
          PROJECT_NAME=$(jq -r '.project.name' deployment.json)

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      ######################################################
      # React Build
      ######################################################

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Build React
        if: hashFiles('package.json') != ''
        run: npm run build

      ######################################################
      # Package React
      ######################################################

      - name: Package React
        if: hashFiles('package.json') != ''
        run: |
          ARCHIVE="release_$(date +%Y%m%d_%H%M%S).tar.gz"

          tar -czf "$ARCHIVE" \
            -C dist \
            .

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      ######################################################
      # Package Static HTML
      ######################################################

      - name: Package Static HTML
        if: hashFiles('package.json') == ''
        run: |
          ARCHIVE="release_$(date +%Y%m%d_%H%M%S).tar.gz"

          TEMP_DIR=$(mktemp -d)

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            ./ "$TEMP_DIR/"

          tar -czf "$ARCHIVE" \
            -C "$TEMP_DIR" \
            .

          rm -rf "$TEMP_DIR"

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      ######################################################
      # Upload Package
      ######################################################

      - name: Copy Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "${{ env.ARCHIVE }}"
          target: "/var/www/apps/${{ env.PROJECT_NAME }}/releases"

      ######################################################
      # Deploy
      ######################################################

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            /opt/deploy-platform/scripts/deploy.sh \
              "${{ env.PROJECT_NAME }}" \
              "${{ env.ARCHIVE }}"